<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rootnative — Building libraries that power React Native and Expo apps">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0A0F1E"/>
    <ellipse cx="170" cy="30" rx="460" ry="240" fill="url(#glowViolet)"/>
    <ellipse cx="1050" cy="290" rx="460" ry="240" fill="url(#glowCyan)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" stroke="#FFFFFF" stroke-opacity="0.09"/>

  <rect x="424" y="49" width="352" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.13"/>
  <text x="600" y="71" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#9FB1D1">OPEN SOURCE · REACT NATIVE TOOLKIT</text>

  <text x="600" y="158" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.5">
    <tspan fill="url(#accent)">root</tspan><tspan fill="#F8FAFC">native</tspan>
  </text>

  <text x="600" y="201" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#8CA0BF">Building libraries that power React Native &amp; Expo apps</text>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#C3D0E5">
    <rect x="367" y="228" width="150" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="442" y="249" text-anchor="middle">TypeScript-first</text>
    <rect x="537" y="228" width="120" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="597" y="249" text-anchor="middle">MIT licensed</text>
    <rect x="677" y="228" width="156" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="755" y="249" text-anchor="middle">Built in the open</text>
  </g>
</svg>
